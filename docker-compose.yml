services:
  gateway:
    build: .
    image: leo-telemetry-gateway:latest
    environment:
      # HTTP/TCP 端口均可通过宿主机 .env 或命令行变量配置
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "${HTTP_PORT:-8080}"
      TCP_HOST: "0.0.0.0"
      TCP_PORT: "${TCP_PORT:-9100}"
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
      - "${TCP_PORT:-9100}:${TCP_PORT:-9100}"
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  # 一次性校验服务：网关健康检查通过后才启动；退出码覆盖
  # 代码测试、镜像内构建与真实 TCP 写入/HTTP 查询冒烟。
  verify:
    image: leo-telemetry-gateway:latest
    build: .
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      GATEWAY_HOST: "gateway"
      GATEWAY_HTTP_PORT: "${HTTP_PORT:-8080}"
      GATEWAY_TCP_PORT: "${TCP_PORT:-9100}"
      HTTP_PORT: "${HTTP_PORT:-8080}"
    entrypoint: ["bash", "scripts/verify.sh"]
    restart: "no"
